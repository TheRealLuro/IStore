services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # NEUTHEK_* keys mirror the Caddyfile placeholders. Legacy
      # installs may set ISTORE_DOMAIN in .env; the shell-style
      # default falls back to it so the rebrand is a no-op for them.
      NEUTHEK_DOMAIN: ${NEUTHEK_DOMAIN:-${ISTORE_DOMAIN:?set NEUTHEK_DOMAIN (or legacy ISTORE_DOMAIN) in .env}}
      NEUTHEK_API_UPSTREAM: backend:8000
      NEUTHEK_FRONTEND_UPSTREAM: frontend:80
      NEUTHEK_MINIO_UPSTREAM: minio:9000
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - minio

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_URL_SYNC_FILE: /run/secrets/database_url_sync
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      MINIO_SECURE: "true"
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-neuthek-originals}
      MINIO_BUCKET_SERVED: ${MINIO_BUCKET_SERVED:-neuthek-served}
      MINIO_BUCKET_FACES: ${MINIO_BUCKET_FACES:-neuthek-faces}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE:-neuthek-quarantine}
      MINIO_SSE_MODE: ${MINIO_SSE_MODE:-sse-s3}
      MINIO_SSE_KMS_KEY_ID_CONTENT_FILE: /run/secrets/minio_kms_key_content
      MINIO_SSE_KMS_KEY_ID_BIOMETRIC_FILE: /run/secrets/minio_kms_key_biometric
      REDIS_URL: redis://redis:6379/0
      FRONTEND_BASE_URL: https://${NEUTHEK_DOMAIN:-${ISTORE_DOMAIN:?set NEUTHEK_DOMAIN (or legacy ISTORE_DOMAIN) in .env}}
      REQUIRE_SIGNED_DOWNLOADS: "true"
      SECRET_MANAGER: docker_secrets
      POSTGRES_AT_REST_ENCRYPTION: host_volume_confirmed
      BACKUP_AGE_RECIPIENT_FILE: /run/secrets/backup_age_recipient
      # Billing secrets via Docker secrets (F14) — same indirection as the DB /
      # JWT / MinIO creds, so the Stripe keys never land in plaintext env. The
      # secret files are OPTIONAL: if billing is disabled just leave them out
      # of the `secrets:` block below (and don't create the files) — config
      # treats an unset Stripe key as "billing off".
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      UPLOAD_MAX_BYTES: "209715200"
      UPLOAD_MAX_COUNT_PER_HOUR: "300"
      UPLOAD_MAX_BYTES_PER_DAY: "10737418240"
      DOWNLOAD_URL_TTL_SECONDS: "300"
    secrets:
      - database_url
      - database_url_sync
      - jwt_secret
      - minio_access_key
      - minio_secret_key
      - minio_kms_key_content
      - minio_kms_key_biometric
      - backup_age_recipient
      # Billing (F14): UNCOMMENT these two to mount the Stripe secrets (and
      # uncomment their definitions in the top-level `secrets:` block + create
      # the files). Left commented by default so non-billing deploys aren't
      # forced to create the files — the STRIPE_*_FILE env refs above resolve
      # to "unset" when the secret isn't mounted, which config treats as
      # "billing off".
      # - stripe_secret_key
      # - stripe_webhook_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${NEUTHEK_DOMAIN:-${ISTORE_DOMAIN:?set NEUTHEK_DOMAIN (or legacy ISTORE_DOMAIN) in .env}}
        VITE_REQUIRE_SIGNED_DOWNLOADS: "true"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuthek}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-neuthek}
      # F7 — password for the least-privilege app role provisioned by
      # deploy/initdb/10-app-role.sql on first init. After the role exists,
      # point DATABASE_URL / DATABASE_URL_SYNC at neuthek_app and keep the
      # POSTGRES_USER superuser only for running migrations. For an EXISTING
      # database the initdb hook does NOT fire — run the script by hand once.
      NEUTHEK_APP_DB_PASSWORD: ${NEUTHEK_APP_DB_PASSWORD:-}
    secrets:
      - postgres_password
    volumes:
      - ${NEUTHEK_DATA_ROOT:-${ISTORE_DATA_ROOT}}/postgres:/var/lib/postgresql/data
      # F7 — provision the NOSUPERUSER NOBYPASSRLS app role on first init so
      # the app can connect without bypassing row-level security.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuthek} -d ${POSTGRES_DB:-neuthek}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${NEUTHEK_DATA_ROOT:-${ISTORE_DATA_ROOT}}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
      MINIO_SERVER_URL: https://${NEUTHEK_DOMAIN:-${ISTORE_DOMAIN:?set NEUTHEK_DOMAIN (or legacy ISTORE_DOMAIN) in .env}}/minio
      MINIO_BROWSER_REDIRECT_URL: https://${NEUTHEK_DOMAIN:-${ISTORE_DOMAIN:?set NEUTHEK_DOMAIN (or legacy ISTORE_DOMAIN) in .env}}/minio-console
    command: server /data --console-address ":9001"
    secrets:
      - minio_access_key
      - minio_secret_key
    volumes:
      - ${NEUTHEK_DATA_ROOT:-${ISTORE_DATA_ROOT}}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  database_url:
    file: ./secrets/database_url.txt
  database_url_sync:
    file: ./secrets/database_url_sync.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  minio_access_key:
    file: ./secrets/minio_access_key.txt
  minio_secret_key:
    file: ./secrets/minio_secret_key.txt
  minio_kms_key_content:
    file: ./secrets/minio_kms_key_content.txt
  minio_kms_key_biometric:
    file: ./secrets/minio_kms_key_biometric.txt
  backup_age_recipient:
    file: ./secrets/backup_age_recipient.txt
  # Billing (F14): create ./secrets/stripe_secret_key.txt +
  # ./secrets/stripe_webhook_secret.txt and UNCOMMENT these + the two lines in
  # the backend service's `secrets:` block above to enable Stripe billing
  # without ever putting the keys in plaintext env.
  # stripe_secret_key:
  #   file: ./secrets/stripe_secret_key.txt
  # stripe_webhook_secret:
  #   file: ./secrets/stripe_webhook_secret.txt

volumes:
  caddy_data:
  caddy_config:
