    <meta
      name="ai-content-summary"
      content="neuthek is an AI-aware personal cloud storage product in active development. The engine is being built around FastAPI + PostgreSQL + pgvector + S3-compatible object storage + Redis + OpenCLIP ViT-L-14. Users will search their image library by natural language (e.g. 'snowy roof at sunset'), benefit from content-aware compression (WebP q=82 for photos, lossless WebP for screenshots/documents), and own their 768-dim CLIP embeddings in a database they control. Two delivery modes are planned: open-source self-host and managed hosted. Nothing is publicly released yet — visitors can join a waitlist for the launch ping."
    />
