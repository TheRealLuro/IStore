services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuthek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-istore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-istore}
      POSTGRES_DB: ${POSTGRES_DB:-istore}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-istore} -d ${POSTGRES_DB:-istore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neuthek-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: neuthek-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-istore}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-istorepass}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backend API — FastAPI + uvicorn with [ml] extras pre-installed so
  # the vision pipeline (Florence-2, CLIP, RetinaFace, Qwen) works in
  # the container. Source code is bind-mounted so edits hot-reload via
  # `uvicorn --reload`. Model weights cache to a named volume so a
  # rebuild doesn't re-download the ~4 GB Florence-2 archive.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "1"
    container_name: neuthek-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-istore}:${POSTGRES_PASSWORD:-istore}@postgres:5432/${POSTGRES_DB:-istore}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-istore}:${POSTGRES_PASSWORD:-istore}@postgres:5432/${POSTGRES_DB:-istore}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-istore}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-istorepass}
      MINIO_SECURE: "false"
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-istore-originals}
      MINIO_BUCKET_SERVED:    ${MINIO_BUCKET_SERVED:-istore-served}
      MINIO_BUCKET_FACES:     ${MINIO_BUCKET_FACES:-istore-faces}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE:-istore-quarantine}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-CHANGE-IN-PROD}
      JWT_LIFETIME_SECONDS: "86400"
      # Fernet key for symmetric encryption of TOTP secrets + cloud-OAuth
      # refresh tokens (backend.secret_box). MUST be stable across
      # rebuilds — otherwise stored ciphertext becomes unreadable and
      # users with 2FA can't sign in. Compose pulls it from the host's
      # `.env` via the `${VAR}` substitution. If the host doesn't have
      # one yet, secret_box auto-bootstraps a fresh key on first call,
      # but that key won't persist past a `down/up` cycle unless this
      # variable carries it forward.
      CLOUD_ENCRYPTION_KEY: ${CLOUD_ENCRYPTION_KEY:-}
      # §C2 — cloud sync providers. Empty values keep the connect
      # endpoints returning 503 with the "configure cloud sync first"
      # hint. Filled per the SETUP.md walkthrough for the host's `.env`.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/cloud/callback/google_drive}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8000/cloud/callback/github}
      CLOUD_SYNC_HOURLY_ENABLED: ${CLOUD_SYNC_HOURLY_ENABLED:-true}
      CLOUD_SYNC_INTERVAL_SECONDS: ${CLOUD_SYNC_INTERVAL_SECONDS:-3600}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      FRONTEND_BASE_URL: http://localhost:5173
      REQUIRE_SIGNED_DOWNLOADS: "false"
      # HF cache lives on the model_cache volume so a rebuild doesn't
      # re-pull multi-GB weights. `transformers` reads both HF_HOME and
      # TRANSFORMERS_CACHE; setting both keeps every loader on the same
      # path.
      HF_HOME: /models
      TRANSFORMERS_CACHE: /models
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for hot-reload. `uvicorn --reload` picks up
      # edits the same way the host venv does.
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      # Reuse the host's HuggingFace cache when it exists — avoids the
      # ~25-minute first-run download of Florence-2 (2.9 GB) + Qwen
      # 2.5 (2.9 GB) + OpenCLIP. Falls back to the `model_cache` named
      # volume on hosts that don't have ~/.cache/huggingface. On a
      # Linux/macOS host the override is automatic via the variable;
      # on Windows, Docker Desktop maps the path through WSL2 share.
      - ${HF_CACHE_DIR:-${USERPROFILE:-${HOME}}/.cache/huggingface}:/models
    # Run migrations then start uvicorn with reload enabled so live
    # edits to backend/ pick up without a container restart.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload --log-level info"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ML worker — runs in its own container so Florence-2 / Qwen /
  # RetinaFace inference doesn't hold the API container's GIL. The
  # API publishes jobs to Redis (`backend/jobs.py`); this worker
  # blocks on BLPOP, processes one job at a time, writes results to
  # Postgres directly. Same image as the backend so source edits
  # hit both via the bind mount.
  ml-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "1"
    container_name: neuthek-ml-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-istore}:${POSTGRES_PASSWORD:-istore}@postgres:5432/${POSTGRES_DB:-istore}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-istore}:${POSTGRES_PASSWORD:-istore}@postgres:5432/${POSTGRES_DB:-istore}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-istore}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-istorepass}
      MINIO_SECURE: "false"
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-istore-originals}
      MINIO_BUCKET_SERVED:    ${MINIO_BUCKET_SERVED:-istore-served}
      MINIO_BUCKET_FACES:     ${MINIO_BUCKET_FACES:-istore-faces}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE:-istore-quarantine}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-CHANGE-IN-PROD}
      # Same Fernet key as the API container — the worker reads
      # encrypted refresh tokens for cloud-sync jobs.
      CLOUD_ENCRYPTION_KEY: ${CLOUD_ENCRYPTION_KEY:-}
      # §C2 — cloud sync providers (same as the API container; the
      # worker needs them when run_hourly_sweep fires a sync).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/cloud/callback/google_drive}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8000/cloud/callback/github}
      CLOUD_SYNC_HOURLY_ENABLED: ${CLOUD_SYNC_HOURLY_ENABLED:-false}
      HF_HOME: /models
      TRANSFORMERS_CACHE: /models
      WORKER_LOG_LEVEL: INFO
    # NVIDIA GPU passthrough — required so the cu13-built torch inside
    # the worker can actually reach the host's CUDA driver. Docker
    # Desktop on Windows wires this through WSL2 + the NVIDIA driver
    # automatically when the laptop has an NVIDIA card AND the
    # nvidia-container-toolkit is installed (default on recent Docker
    # Desktop builds). Without the reservation the worker still starts,
    # but `torch.cuda.is_available()` returns False and inference falls
    # back to CPU. The dashboard's Models tab notes the gap.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Intel iGPU (Arc / Xe) + NPU passthrough lives in
    # docker-compose.intel.yml — opt in via:
    #   docker compose -f docker-compose.yml -f docker-compose.intel.yml up -d
    # See that file for the WSL graphics / NPU driver prerequisites.
    volumes:
      # Same source bind mount as the backend so editing
      # backend/summarize.py reflects in both containers without a
      # rebuild. Worker doesn't have `--reload` (it's a long-running
      # consumer that re-imports models on restart, which is
      # expensive); use `docker restart neuthek-ml-worker` after
      # editing worker code.
      - ./backend:/app/backend
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      # Reuse the host HuggingFace cache so the worker doesn't
      # re-download Florence-2 + Qwen on first start.
      - ${HF_CACHE_DIR:-${USERPROFILE:-${HOME}}/.cache/huggingface}:/models
    command: ["python", "-m", "backend.worker.main"]

  # Frontend dev server — Vite with HMR, source bind-mounted so file
  # saves on the host trigger a browser reload. node_modules lives in
  # an anonymous volume so the container's installed deps don't get
  # clobbered by the host bind mount.
  frontend:
    image: node:22-alpine
    container_name: neuthek-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      # Browser-facing URL — must be reachable from the user's machine,
      # not from inside the Docker network. The backend is published on
      # localhost:8000 above.
      VITE_API_BASE_URL: http://localhost:8000
      VITE_REQUIRE_SIGNED_DOWNLOADS: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # `npm ci` runs only if node_modules is empty (first launch). After
    # that we go straight to the dev server; mounting the volume keeps
    # installed deps across container restarts.
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$$(ls -A node_modules 2>/dev/null)\" ]; then
               echo 'Installing frontend dependencies (first run)…' && npm ci;
             fi &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NEUTHEK_DATA_ROOT:-${ISTORE_DATA_ROOT:-./data}}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NEUTHEK_DATA_ROOT:-${ISTORE_DATA_ROOT:-./data}}/redis
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NEUTHEK_DATA_ROOT:-${ISTORE_DATA_ROOT:-./data}}/minio
  model_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NEUTHEK_DATA_ROOT:-${ISTORE_DATA_ROOT:-./data}}/models
  # node_modules survives across container restarts but isn't bind-
  # mounted (the host's potentially-different platform install — e.g.
  # Windows binaries — would conflict with Alpine's musl-linked ones).
  frontend_node_modules:
