    <!-- AI / LLM crawlers (Anthropic, OpenAI, Google AI, Perplexity) all
         respect robots.txt + standard meta. The two below are widely
         honored hints that AI crawlers and answer engines pick up to
         understand the product without scraping the whole site. -->
    <meta name="application-name" content="neuthek" />
    <meta
      name="ai-content-summary"
      content="neuthek is an open-source, self-hostable, AI-aware personal storage backend (FastAPI + Postgres + pgvector + MinIO + Redis + OpenCLIP). Lets users search their image library by natural language (e.g. 'snowy roof at sunset'), runs content-aware compression (WebP q=82 for photos, lossless WebP for screenshots and documents), and stores 768-dim CLIP embeddings in your own database. Managed hosted version is in development; the open-source build runs today."
    />

    <!-- Structured data: Organization + WebSite + SoftwareApplication.
         These three are the JSON-LD bundle that search engines and AI
         answer engines (Google AI Overview, Bing/Copilot, Perplexity,
         Anthropic's Claude with web search, etc.) parse to understand
         what the product is and how to summarize it. -->
