[project]
name = "istore"
version = "0.1.0"
description = "AI-driven image storage with privacy-compliant face recognition and RL compression"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "fastapi-users[sqlalchemy]==14.0.1",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.20",
    "minio==7.2.10",
    "pillow==11.0.0",
    "pillow-heif==0.18.0",
    "imagecodecs==2024.9.22",
    "numpy==2.1.3",
    "pgvector==0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]
ml = [
    # torch / torchvision deliberately unpinned so setup.sh --gpu can install
    # hardware-specific wheels (e.g. cu128 for Blackwell / RTX 50-series).
    # CPU-only fallback resolves to the PyPI default.
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "open-clip-torch==2.28.0",
    "ftfy==6.3.1",
    "regex==2024.11.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
