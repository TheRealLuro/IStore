<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b5b5b5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Mark -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="22" fill="#ffffff"/>
    <circle cx="28" cy="28" r="14" fill="#0a0a0a"/>
    <circle cx="58" cy="58" r="8" fill="#8a8a8a"/>
  </g>
  <text x="190" y="135" font-family="Geist, system-ui, sans-serif"
        font-weight="600" font-size="48" fill="#ffffff" letter-spacing="-1">
    neuthek
  </text>

  <!-- Headline -->
  <text x="80" y="320" font-family="Geist, system-ui, sans-serif"
        font-weight="600" font-size="84" letter-spacing="-3"
        fill="url(#ink)">
    The next best
  </text>
  <text x="80" y="420" font-family="Geist, system-ui, sans-serif"
        font-weight="600" font-size="84" letter-spacing="-3"
        fill="url(#ink)">
    cloud storage solution.
  </text>

  <!-- Sub -->
  <text x="80" y="500" font-family="Geist, system-ui, sans-serif"
        font-weight="400" font-size="28" fill="#b5b5b5">
    Open source. Self-hostable. Semantic search.
  </text>
  <text x="80" y="540" font-family="Geist, system-ui, sans-serif"
        font-weight="400" font-size="28" fill="#b5b5b5">
    Hosted version coming soon.
  </text>

  <!-- Footer dot -->
  <circle cx="1100" cy="555" r="8" fill="#f59e0b"/>
  <text x="1080" y="560" font-family="Geist Mono, monospace"
        font-size="18" fill="#b5b5b5" text-anchor="end">
    neuthek.com
  </text>
</svg>
