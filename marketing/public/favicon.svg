<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Solid black rounded square so the mark reads at any size,
       including Google SERP's ~16x16 rasterisation. The constellation
       glyph uses bold strokes (1.8 / 2.4 px on a 64-unit canvas, so
       still visible at 16x16) and no opacity reduction. -->
  <rect width="64" height="64" rx="16" ry="16" fill="#0a0a0a"/>
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="18" y1="44" x2="22" y2="18"/>
    <line x1="22" y1="18" x2="44" y2="44"/>
    <line x1="44" y1="44" x2="48" y2="20"/>
    <line x1="18" y1="28" x2="34" y2="30"/>
    <line x1="34" y1="30" x2="48" y2="20"/>
  </g>
  <g fill="#ffffff">
    <circle cx="18" cy="44" r="3.4"/>
    <circle cx="22" cy="18" r="3.4"/>
    <circle cx="44" cy="44" r="3.4"/>
    <circle cx="18" cy="28" r="2.6"/>
    <circle cx="34" cy="30" r="2.6"/>
    <circle cx="48" cy="20" r="4.8"/>
  </g>
</svg>
