[project]
name = "neuthek"
version = "0.1.0"
description = "AI-driven personal storage with privacy-compliant face recognition and RL compression"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "fastapi-users[sqlalchemy]==14.0.1",
    "argon2-cffi==23.1.0",
    "python-multipart==0.0.27",
    "minio==7.2.10",
    "pillow==11.0.0",
    "pillow-heif==0.18.0",
    "imagecodecs==2024.9.22",
    "numpy==2.1.3",
    "pgvector==0.3.6",
    "redis>=5.2.0",
    # PyMuPDF — rasterizes PDF page 1 for the gallery card thumb and the
    # in-app preview hero. Without it, PDFs fall back to a generic icon
    # and the "Generate PDF thumbnails" admin action becomes a no-op.
    "PyMuPDF>=1.24.0",
    # psutil — cross-platform process + system probes powering the
    # admin overlay's System / Processes / Hardware tabs (todo §1.3).
    # Falls back gracefully to /dev/null-shaped responses when a
    # platform doesn't expose a particular metric.
    "psutil>=5.9.0",
    # 2FA TOTP (todo §1.2.3) — pyotp generates RFC 6238 codes and
    # provisioning URIs; qrcode renders the URI as a PNG the FE can
    # show inline (no third-party QR service so the secret never
    # leaves the host).
    "pyotp>=2.9.0",
    "qrcode>=8.0",
    # Stripe billing — embedded checkout, webhooks, customer portal.
    # SDK imports lazily inside `backend/billing.py` so the API still
    # boots when `STRIPE_SECRET_KEY` is empty (dev / self-host).
    "stripe>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]
ml = [
    # torch / torchvision deliberately unpinned so setup.sh --gpu can install
    # hardware-specific wheels (e.g. cu128 for Blackwell / RTX 50-series).
    # CPU-only fallback resolves to the PyPI default.
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "open-clip-torch==2.28.0",
    "ftfy==6.3.1",
    "regex==2024.11.6",
    # Phase 4: face detection (RetinaFace) + embedding (ArcFace).
    # `buffalo_l` weights download lazily on first call (~290 MB).
    "insightface==0.7.3",
    "onnxruntime==1.20.1",
    # Phase 11 v2 — AI Vision summaries.
    # Captioning: Florence-2-large (~3.4 GB) for detailed captions + OCR.
    #   Bundled `configuration_florence2.py` (trust_remote_code=True)
    #   accesses `forced_bos_token_id` directly on its language config —
    #   that field moved in transformers 5.x. AND its bundled
    #   `modeling_florence2.py` uses the pre-Cache `past_key_values`
    #   shape (tuple of tuples) that the transformers 4.50 generation
    #   refactor removed; every Florence task (caption / OCR / dense
    #   regions / OD) raises `KeyError: Cache only has 0 layers` once
    #   beam search starts. Pin <4.50 until Microsoft updates the
    #   bundled code — without this, Florence-2 silently disables
    #   itself after the first image and the whole library falls back
    #   to BLIP one-clause captions.
    # Rewriter: Qwen2.5-1.5B-Instruct (~3 GB) — Qwen2 arch is in 4.45+.
    # einops/timm are required by Florence-2's custom modeling code.
    # Doc extraction libs are pure Python — no native build deps.
    "transformers>=4.45,<4.50",
    "tokenizers>=0.20,<0.22",
    "einops>=0.8.0",
    "timm>=1.0.11",
    "accelerate>=1.0.0",
    "pypdf>=5.0",
    # Layout-heavy PDFs (two-column papers, scanned pages with embedded
    # fonts) often defeat pypdf — pdfminer.six handles them. Used as a
    # fallback in `backend.summarize._extract_pdf` when pypdf returns
    # almost nothing.
    "pdfminer.six>=20240706",
    # Image-only PDFs (scanned docs, contracts photographed page-by-
    # page) defeat both text extractors above. PyMuPDF rasterizes each
    # page, then `_pdf_ocr_fallback` runs Florence-2 `<OCR>` over the
    # raster.
    "pymupdf>=1.24",
    # D8 — last-resort face detector for the user-signal cascade
    # (RetinaFace 0.3 → 0.15 → mediapipe). Mediapipe finds faces in
    # tight crops / extreme angles where RetinaFace's landmark
    # requirement fails. Optional dep; the cascade gracefully skips
    # the mediapipe stage if it's not installed.
    "mediapipe>=0.10",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "sumy>=0.11.0",
    "nltk>=3.9",
]
cloud = [
    # C2 — Google Drive sync. cryptography is already pulled in transitively
    # via insightface/onnxruntime in `ml`, but pin here too so the cloud
    # extra is independently installable. google-api-python-client lazily
    # imports its discovery cache; we set cache_discovery=False at call
    # site to silence the warning.
    "cryptography>=42.0",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.140",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
